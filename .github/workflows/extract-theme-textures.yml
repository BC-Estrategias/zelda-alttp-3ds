name: Extract theme reference textures

on:
  push:
    branches: [qol-quicksave-rewind]
    paths:
      - 'tools/extract_theme_textures.py'
      - '.github/workflows/extract-theme-textures.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qol-quicksave-rewind
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Extract PNG textures
        run: python tools/extract_theme_textures.py
      - name: Commit extracted references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme_reference/*.png
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Generate theme reference textures"
          git push origin HEAD:qol-quicksave-rewind
